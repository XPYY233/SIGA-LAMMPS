[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siga-lammps"
version = "0.1.0"
description = "SIGA-style LAMMPS adapter for DeepSeekHarness: procedural memory, retrieval, deterministic validation, enforced stop hook, and HPC execution"
requires-python = ">=3.11"

# Core runtime deps are added per module as that module is implemented.
# config/ and adapter/memory/ are deliberately stdlib-only so they work before
# any install step.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
retrieval = ["chromadb>=0.5"]
hpc = ["paramiko>=3.4"]
mcp = ["mcp>=1.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["config", "adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

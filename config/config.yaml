# SIGA-LAMMPS committed policy and defaults.
#
# This file is VERSIONED and contains no secrets and no machine-specific paths.
# Anything that differs per deployment (host alias, account, remote paths,
# module names) belongs in the git-ignored `.env` instead.
#
# Division of responsibility:
#   config.yaml  non-secret policy, thresholds, and hard ceilings — committed
#   .env         deployment specifics and secrets — never committed
#
# Resource ceilings are the MINIMUM of the two sources (see config/loader.py),
# so neither file can unilaterally raise a limit the other tightened.

memory:
  # The M primer. Kept as a plain Markdown document, read verbatim.
  path: adapter/memory/lammps_memory.md
  # Hard size budget in characters. The harness applies NO prompt token cap and
  # never truncates an always-on section, so this is the only guard against
  # silent prompt bloat. Every request pays this cost.
  #
  # This value ENCODES the project's ceiling for M: 2000 tokens. At the harness's
  # CHARS_PER_TOKEN = 4 that is 8000 characters. It is a design bound, not a
  # measurement.
  #
  # M holds high-frequency procedural knowledge: rules, ordering, unit
  # conventions, integrator patterns, output guidance, common fatal mistakes,
  # tool guidance, a completion checklist. Anything long, task-specific, or
  # reliably retrievable belongs in R — see docs/design-principles.md §2. A
  # growth past this budget means knowledge is being kept always-on that should
  # be retrieved on demand.
  #
  # The primer measures 6255 chars (~1563 tokens), leaving ~436 tokens of
  # headroom. tests/test_memory.py fails on growth, fails if the budget drifts
  # far above the content, and asserts task-specific recipes stay out entirely.
  max_chars: 8000

validator:
  # Deterministic only — no LLM participates in validation.
  # Findings are ordered by severity; S blocks on `errors`, not on `warnings`.
  block_on_warnings: false
  # A script longer than this is almost certainly not a benchmark task.
  max_lines: 400
  # Commands that must appear for ANY valid LAMMPS input script.
  universal_required:
    - units
    - atom_style
    - run
  # Only these styles are supported in v1; anything else is a warning, not an
  # error, so an unusual-but-valid script is not falsely rejected.
  supported_atom_styles:
    - atomic
    - charge
    - molecular
    - full
  supported_unit_styles:
    - lj
    - real
    - metal
    - si
    - cgs
    - electron
    - micro
    - nano

retrieval:
  persist_dir: data/index
  # Where the ONNX embedding model is cached. ChromaDB defaults to
  # ~/.cache/chroma; we keep it inside the project instead, so the cache is
  # reproducible, trivially removable, and does not write to $HOME.
  # Fetched once on the first index build; retrieval is offline afterwards.
  model_cache_dir: data/models
  top_k: 5
  # Three collections, mirroring the paper's LAMMPS port.
  collections:
    - examples     # LAMMPS example scripts
    - docs         # documentation RST
    - syntax       # command syntax extracted from the source tree
  # The corpus is a LAMMPS source checkout, not a committed artifact: it is
  # large and upstream-licensed. This is only a default — the real path is
  # deployment-specific and normally comes from SIGA_LAMMPS_CORPUS in .env.
  corpus_dir: data/raw

slurm:
  # Hard ceilings. The agent may REQUEST less; it can never exceed these.
  # Effective value = min(this, .env), enforced in hpc/slurm.py.
  ceilings:
    max_nodes: 1
    max_ntasks: 64
    max_walltime: "02:00:00"
  # Ceilings for a job the agent did not explicitly size.
  defaults:
    nodes: 1
    ntasks: 8
    walltime: "00:30:00"

lammps:
  # Local executable used by the offline validation and smoke-test stage.
  # Overridable by SIGA_LAMMPS_LOCAL_BIN in .env.
  local_bin: lmp
  # A generated run must reach this stage to count as "LAMMPS initialized".
  init_success_marker: "Setting up Verlet run"
  run_success_marker: "Total wall time"

benchmark:
  # Frozen task set. These five classes are the whole of v1's scope.
  tasks_dir: benchmark/tasks
  ground_truth_dir: benchmark/ground_truth
  runs_dir: benchmark/runs
  # The four ablation configurations, by agent-preset id.
  # Identical LLM, identical harness; only the mounted adapter differs.
  configurations:
    - vanilla
    - m
    - mr
    - mrsx
